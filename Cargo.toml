[workspace]
members = ["crates/acars", "crates/datalink", "crates/datalink-wasm"]
resolver = "2"

[workspace.package]
license = "MIT"
edition = "2021"
readme = "readme.md"
version = "0.2.0"
authors = ["Xavier Olive <git@xoolive.org>"]

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.6", features = ["derive", "env"] }
deku = "0.20.2"
desperado = { version = "0.4.2", features = ["resampler"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = "thin"
overflow-checks = true

[profile.dist]
inherits = "release"
lto = true
strip = true
