name: WebAssembly

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing/provenance.
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - uses: extractions/setup-just@v4

      - name: Check lean wasm dependencies
        run: cargo check -p datalink-wasm --target wasm32-unknown-unknown

      - name: Test wasm bindings in Node
        working-directory: crates/datalink-wasm
        run: wasm-pack test --node

      - name: Build npm package
        working-directory: crates/datalink-wasm
        run: just pkg

      - name: Smoke-test generated Node package
        working-directory: crates/datalink-wasm
        run: |
          node <<'JS'
          const { decode_arinc622 } = require("./pkg/nodejs/datalink_wasm.js");
          const raw = "/MGQCAYA.ADS.ET-AUQ07290B8E0C000D000E01100011000F011500010144";
          const decoded = decode_arinc622(raw, "uplink");
          if (decoded.payload.adsc[0].periodic_contract_request.contract_number !== 41) {
            throw new Error("unexpected ADS-C decode result");
          }
          JS

      - name: Inspect npm package
        working-directory: crates/datalink-wasm/pkg
        run: npm pack --dry-run

      - name: Publish to npm (upon workspace release tag)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: crates/datalink-wasm/pkg
        env:
          NPM_CONFIG_PROVENANCE: true
        run: npm publish
