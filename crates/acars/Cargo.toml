repository = "https://github.com/xoolive/vdl136"
keywords = ["acars", "vdl", "aviation", "decoder"]
authors.workspace = true
version.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
deku = "0.20.2"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
desperado = { path = "../../../desperado/crates/desperado" }

[dev-dependencies]
