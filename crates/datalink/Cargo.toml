[package]
name = "datalink"
description = "Decode aviation datalink traffic from payloads, SDR, files, and Airframes.io"
repository = "https://github.com/xoolive/vdl136"
authors.workspace = true
version.workspace = true
license.workspace = true
edition.workspace = true

[features]
default = ["rtlsdr", "airspy", "hackrf", "soapy", "websocket"]
sdr = []
rtlsdr = ["sdr", "desperado/rtlsdr"]
airspy = ["sdr", "desperado/airspy"]
hackrf = ["sdr", "desperado/hackrf"]
soapy = ["sdr", "desperado/soapy"]
websocket = []

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
acars = { path = "../acars" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
desperado = { version = "0.4.1", features = ["resampler"] }
rustfft = "6"
dirs = "6"
tokio = { version = "1", features = ["full"] }
url = "2.5"
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
http = "1"
tokio-rustls = { version = "0.26", features = ["ring"] }
rustls = { version = "0.23", features = ["ring"] }
webpki-roots = "0.26"
hound = "3.5"

[dev-dependencies]
toml = "0.9"
