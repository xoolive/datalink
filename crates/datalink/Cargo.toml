[package]
name = "datalink"
description = "Decode aviation datalink traffic from payloads, SDR, files, and Airframes.io"
repository = "https://github.com/xoolive/datalink"
homepage = "https://github.com/xoolive/datalink"
authors.workspace = true
version.workspace = true
license.workspace = true
edition.workspace = true

[features]
default = ["rtlsdr", "airspy", "hackrf", "websocket"]
sdr = []
rtlsdr = ["sdr", "desperado/rtlsdr"]
airspy = ["sdr", "desperado/airspy"]
hackrf = ["sdr", "desperado/hackrf"]
soapy = ["sdr", "desperado/soapy"]
websocket = []

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
hex.workspace = true
acars = { version = "0.1.0", path = "../acars", features = ["demod"] }
serde.workspace = true
serde_json.workspace = true
desperado.workspace = true
rustfft = "6"
dirs = "6"
tokio.workspace = true
url = "2.5"
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
http = "1"
tokio-rustls = { version = "0.26", features = ["ring"] }
rustls = { version = "0.23", features = ["ring"] }
webpki-roots = "0.26"
hound = "3.5"
redis = { version = "1.2", features = ["tokio-comp"] }
toml = "1.0"

[dev-dependencies]
